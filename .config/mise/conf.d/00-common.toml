# Configuration for mise (https://mise.jdx.dev/configuration.html)

min_version = "2026.2.0"

[env]
# NOTE: Common configuration variables should begin with "MENV_"
#       and are intended for consistent use in tasks at runtime!

# Directory for tooling configs
MENV_CONFIG_DIR = ".config"

[settings]
experimental = true
lockfile = true
locked = true
